[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lanbridge"
version = "0.1.0"
description = "Private, paired desktop file transfers over your local network"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["cryptography>=44", "platformdirs>=4,<5", "zeroconf>=0.147,<1", "PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11", "pyinstaller>=6.12"]

[project.scripts]
lanbridge = "lanbridge.__main__:main"

[project.gui-scripts]
lanbridge-desktop = "lanbridge.__main__:main"

[tool.setuptools.packages.find]
include = ["lanbridge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
